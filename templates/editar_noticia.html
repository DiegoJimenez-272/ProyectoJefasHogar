<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Noticia - Jefas de Hogar</title>
    <link rel="icon" href="/media/logos/ISOTIPO.png" type="image/png" sizes="32x32 64x64">
    <style>
        /* --- ESTILO DASHBOARD SIDEBAR (Moderno, Lateral y Limpio) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #F4F5FD; color: #2D2A4A; font-smoothing: antialiased; }
        
        /* Contenedor Principal Flex */
        .admin-layout { display: flex; min-height: 100vh; }
        
        /* 1. Sidebar (Menú Lateral) */
        .sidebar { 
            width: 280px; 
            background-color: #5956B3; 
            color: #FFFFFF; 
            display: flex; 
            flex-direction: column; 
            padding: 2rem 1.5rem; 
            flex-shrink: 0;
            box-shadow: 4px 0 15px rgba(89, 86, 179, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: 100vh;
            z-index: 999;
            transition: transform 0.3s ease;
        }
        
        .sidebar-logo { 
            margin-bottom: 3rem; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            height: 70px;
            overflow: hidden;
        }
        .sidebar-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sidebar-nav { display: flex; flex-direction: column; gap: 0.8rem; }
        .nav-item { 
            display: flex; 
            align-items: center; 
            gap: 1.2rem; 
            padding: 1rem 1.5rem; 
            color: #D2D0F0; 
            text-decoration: none; 
            font-weight: 700; 
            border-radius: 30px; 
            transition: all 0.3s ease; 
        }
        .nav-item:hover { background-color: rgba(255, 255, 255, 0.08); color: #FFFFFF; }
        .nav-item.active { 
            background: linear-gradient(135deg, #C07DE3, #E1799F); 
            color: #FFFFFF; 
            box-shadow: 0 8px 20px rgba(225, 121, 159, 0.25); 
        }
        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .nav-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* 2. Área de Contenido de la Derecha */
        .main-content { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            margin-left: 280px;
            transition: margin-left 0.3s ease;
        }
        
        /* Cabecera Superior */
        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.5rem 3rem; 
            background: #FFFFFF; 
            box-shadow: 0 4px 15px rgba(89, 86, 179, 0.03); 
        }
        .toggle-sidebar-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #5956B3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .toggle-sidebar-btn:hover {
            background-color: #F8F3FB;
        }
        .admin-layout.collapsed-sidebar .sidebar {
            transform: translateX(-280px);
        }
        .admin-layout.collapsed-sidebar .main-content {
            margin-left: 0;
        }
        .page-info h1 { font-size: 1.5rem; color: #5956B3; font-weight: 800; }
        .user-profile { display: flex; align-items: center; gap: 1rem; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #C07DE3, #E1799F); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(225, 121, 159, 0.2); }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 800; color: #2D2A4A; font-size: 1rem; }
        .user-role { color: #69658A; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        /* Área de Contenido Interno */
        .content-body { padding: 1.5rem 2rem; }

        /* Tarjeta del formulario */
        .form-card { background: #FFFFFF; border-radius: 30px; padding: 3rem; box-shadow: 0 15px 35px rgba(89, 86, 179, 0.03); width: 100%; border: 1px solid #DBB6EF; margin-bottom: 2.5rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .form-card:hover { transform: translateY(-5px); box-shadow: 0 25px 45px rgba(89, 86, 179, 0.06); }
        .form-card h3 { color: #5956B3; margin-bottom: 1.2rem; font-size: 1.25rem; border-bottom: 2px dashed #F2E8F9; padding-bottom: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
        
        /* Inputs y Grupos */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 0.8rem; display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-weight: 700; margin-bottom: 0.4rem; color: #69658A; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { padding: 0.65rem 1rem; border: 2px solid transparent; border-radius: 12px; outline: none; font-size: 0.95rem; transition: all 0.3s ease; background-color: #F2E8F9; width: 100%; color: #2D2A4A; font-weight: 500; }
        input:focus, select:focus, textarea:focus { border-color: #C07DE3; background-color: #FFFFFF; box-shadow: 0 8px 20px rgba(192, 125, 227, 0.15); }
        textarea { resize: vertical; min-height: 80px; }
        
        /* Botones */
        .btn-submit { background: linear-gradient(135deg, #C07DE3, #E1799F); color: #FFFFFF; border: none; padding: 0.7rem 1.8rem; font-size: 0.95rem; font-weight: 700; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(225, 121, 159, 0.25); letter-spacing: 0.5px; margin-top: 1rem; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(225, 121, 159, 0.35); }
        
        .btn-secondary { background: #FFFFFF; color: #5956B3; border: 2px solid #DBB6EF; padding: 0.8rem 1.5rem; font-size: 0.95rem; font-weight: 700; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; text-align: center; display: inline-block; margin-top: 1rem; }
        .btn-secondary:hover { background: #F2E8F9; border-color: #5956B3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(89, 86, 179, 0.1); }
        
        .img-preview { max-width: 200px; border-radius: 16px; margin-top: 12px; border: 2px solid #DBB6EF; box-shadow: 0 4px 12px rgba(89, 86, 179, 0.08); }

        /* Estilos para Iconos PNG de Interfaz */
        .sidebar-icon-img {
            width: 48px;
            height: 48px;
            max-width: none;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.65;
            transition: all 0.3s ease;
            display: inline-block;
            vertical-align: middle;
        }
        .nav-item:hover .sidebar-icon-img,
        .nav-item.active .sidebar-icon-img {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        
        <!-- 1. Menú Lateral (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="/">
                    <img src="/media/logos/Imagotipo%20para%20fondo%20oscuro.png" alt="Talento Mujer Logo">
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{% url 'panel_admin' %}" class="nav-item">
                    <span class="nav-icon">
                        <img src="/media/Funcional/Funcional/Iconos%20lila/Grupo%202/Dashboard.png" alt="Dashboard" class="sidebar-icon-img">
                    </span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="{% url 'administrar_emprendedoras' %}" class="nav-item">
                    <span class="nav-icon">
                        <img src="/media/Funcional/Funcional/Iconos%20lila/Grupo%202/Emprendedora.png" alt="Emprendedoras" class="sidebar-icon-img">
                    </span>
                    <span class="nav-text">Emprendedoras</span>
                </a>
                <a href="{% url 'personalizar_hero' %}" class="nav-item">
                    <span class="nav-icon">
                        <img src="/media/Funcional/Funcional/Iconos%20lila/Grupo%202/Proceso.png" alt="Contenido" class="sidebar-icon-img">
                    </span>
                    <span class="nav-text">Contenido</span>
                </a>
                <a href="{% url 'agregar_noticia' %}" class="nav-item active">
                    <span class="nav-icon">
                        <img src="/media/Funcional/Funcional/Iconos%20lila/Grupo%202/Noticias.png" alt="Noticias" class="sidebar-icon-img">
                    </span>
                    <span class="nav-text">Noticias</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="{% url 'logout_admin' %}" class="nav-item" style="color: #DC7A96;">
                    <span class="nav-icon">
                        <img src="/media/Funcional/Funcional/Iconos%20lila/Grupo%202/Cerrar%20sesi%C3%B3n.png" alt="Cerrar Sesión" class="sidebar-icon-img">
                    </span>
                    <span class="nav-text">Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- 2. Área de Contenido Principal -->
        <div class="main-content">
            <!-- Cabecera Superior -->
            <header class="top-header">
                <div class="page-info" style="display: flex; align-items: center; gap: 1rem;">
                    <button class="toggle-sidebar-btn" id="sidebarToggle" aria-label="Ocultar Menú">☰</button>
                    <h1>Editar Noticia</h1>
                </div>
                <div class="user-profile">
                    <div class="avatar">AD</div>
                    <div class="user-info">
                        <span class="user-name">Administrador</span>
                        <span class="user-role">Admin</span>
                    </div>
                </div>
            </header>
            
            <!-- Cuerpo de la Página -->
            <div class="content-body">
                
                <!-- Formulario de Edición -->
                <div class="form-card">
                    <h3>Modificar los Datos de la Noticia</h3>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>Título de la Noticia</label>
                                <input type="text" name="titulo" value="{{ noticia.titulo }}" required placeholder="Ej: Exitosa Feria Artesanal de Invierno">
                            </div>
                            <div class="form-group full-width">
                                <label>Foto / Imagen Principal</label>
                                <input type="file" name="imagen" accept="image/*">
                                {% if noticia.imagen %}
                                    <p style="margin-top: 10px; font-size: 0.85rem; color: #69658A; font-weight: 700;">Imagen Actual:</p>
                                    <img src="{{ noticia.imagen.url }}" alt="{{ noticia.titulo }}" class="img-preview">
                                {% endif %}
                            </div>
                            <div class="form-group full-width">
                                <label>Contenido</label>
                                <textarea name="contenido" required placeholder="Escribe el cuerpo de la noticia...">{{ noticia.contenido }}</textarea>
                            </div>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn-submit" style="display: inline-flex; align-items: center; gap: 0.8rem; justify-content: center;">
                                <img src="/media/Funcional/Funcional/Iconos%20morado/Grupo%201/Guardar%20copia.png" alt="Guardar" style="width: 24px; height: 24px; object-fit: contain; filter: brightness(0) invert(1);">
                                <span>Guardar Cambios</span>
                            </button>
                            <a href="{% url 'agregar_noticia' %}" class="btn-secondary">Cancelar y Volver</a>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
        
    </div>

    <script>
        const toggleBtn = document.getElementById('sidebarToggle');
        const adminLayout = document.querySelector('.admin-layout');
        if (toggleBtn && adminLayout) {
            toggleBtn.addEventListener('click', () => {
                adminLayout.classList.toggle('collapsed-sidebar');
            });
        }
    </script>
</body>
</html>
